services:
  # ==========================================
  # Web Application Service (Next.js)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-blog_user}:${POSTGRES_PASSWORD:-blog_secure_password_replace_in_prod}@db:5432/${POSTGRES_DB:-blog_db}?schema=public
      - SESSION_SECRET=${SESSION_SECRET:-change-this-to-a-very-secure-random-32-char-secret-key-12345}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@xyz.in}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-ReplaceWithAStrongAdminPassword123!}
      - ADMIN_NAME=${ADMIN_NAME:-Author}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://blog.xyz.in}
      - NEXT_PUBLIC_SITE_NAME=${NEXT_PUBLIC_SITE_NAME:-Alex Johnson}
      - NEXT_PUBLIC_SITE_TAGLINE=${NEXT_PUBLIC_SITE_TAGLINE:-Writing on software systems, web engineering, and product craft.}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - blog_network

  # ==========================================
  # Database Service (PostgreSQL 16)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: blog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog_secure_password_replace_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-blog_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog_user} -d ${POSTGRES_DB:-blog_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - blog_network

volumes:
  postgres_data:
    name: blog_postgres_data
  uploads_data:
    name: blog_uploads_data

networks:
  blog_network:
    name: blog_network
    driver: bridge
